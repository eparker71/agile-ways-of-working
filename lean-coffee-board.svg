<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1190" width="1680" height="1190" role="img" aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Lean Coffee</title>
  <desc id="mg-desc">A3 landscape Lean Coffee board: To Discuss, Discussing (current topic, timebox and keep-going vote) and Discussed columns, a five-step how-it-works row, and three action slots.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="fc" x="-4%" y="-4%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <filter id="fsm" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1.2" fill="#000" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1680" height="1190" fill="url(#bg)"/><rect x="0" y="0" width="1680" height="4" fill="#eb6c36"/><rect x="0" y="4" width="1680" height="134" fill="#0C1A2E"/><text x="24" y="70" font-family="'Instrument Serif',Georgia,serif" font-size="42" font-weight="400" fill="white">Lean Coffee</text><text x="24" y="100" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" fill="#94A3B8">A structured, agenda-less meeting: the group sets the topics, votes on them, and talks about what matters most.</text><text x="24" y="120" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#475569" letter-spacing=".06em">Facilitation Toolkit · Participant-Driven Meetings · Timeboxed Conversations</text><text x="1356" y="44" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#475569" letter-spacing=".14em">LEGEND</text><rect x="1356" y="52" width="22" height="22" rx="3" fill="#FDE047" filter="url(#fsm)"/><polygon points="1371,52 1378,59 1378,52" fill="#000" fill-opacity=".15"/><text x="1384" y="67" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#CBD5E1">Yellow Sticky = Discussion Topic</text><rect x="1356" y="80" width="22" height="22" rx="3" fill="#4ADE80" filter="url(#fsm)"/><polygon points="1371,80 1378,87 1378,80" fill="#000" fill-opacity=".15"/><text x="1384" y="95" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#CBD5E1">Green Sticky = Takeaway / Action</text><circle cx="1367" cy="119" r="9" fill="#eb6c36"/><text x="1384" y="123" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#CBD5E1">Dot = Vote (3 per person)</text>
<rect x="24" y="148" width="600" height="640" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,200 V158 A10,10 0 0 1 34,148 H614 A10,10 0 0 1 624,158 V200 Z" fill="#1E3A8A"/><circle cx="45" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="45" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">1</text><text x="68" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">To Discuss</text>
<text x="42" y="236" font-family="'Instrument Serif',Georgia,serif" font-size="22" font-style="italic" fill="#1E3A8A">What do we want to talk about?</text>
<circle cx="46" cy="264" r="2.5" fill="#1E3A8A" fill-opacity=".55"/><text x="56" y="268" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">One topic per sticky, pitched in a sentence</text><circle cx="46" cy="282" r="2.5" fill="#1E3A8A" fill-opacity=".55"/><text x="56" y="286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">Dot-vote, then sort by votes (most at the top)</text>
<line x1="34" y1="314" x2="614" y2="314" stroke="#1E3A8A" stroke-width="1" stroke-opacity=".20" stroke-dasharray="5,4"/>
<rect x="34" y="320" width="580" height="456" rx="6" fill="url(#dots)"/><text x="324" y="542" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#1E3A8A" fill-opacity=".22">Add your sticky notes here</text><rect x="315" y="556" width="18" height="18" rx="2" fill="#FDE047" fill-opacity=".35"/>
<rect x="1056" y="148" width="600" height="640" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1056,200 V158 A10,10 0 0 1 1066,148 H1646 A10,10 0 0 1 1656,158 V200 Z" fill="#065F46"/><circle cx="1077" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="1077" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">3</text><text x="1100" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Discussed</text>
<text x="1074" y="236" font-family="'Instrument Serif',Georgia,serif" font-size="22" font-style="italic" fill="#065F46">What have we covered?</text>
<circle cx="1078" cy="264" r="2.5" fill="#065F46" fill-opacity=".55"/><text x="1088" y="268" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#065F46">Move the topic here when the group moves on</text><circle cx="1078" cy="282" r="2.5" fill="#065F46" fill-opacity=".55"/><text x="1088" y="286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#065F46">Add a green sticky with the key takeaway</text>
<line x1="1066" y1="314" x2="1646" y2="314" stroke="#065F46" stroke-width="1" stroke-opacity=".20" stroke-dasharray="5,4"/>
<rect x="1066" y="320" width="580" height="456" rx="6" fill="url(#dots)"/><text x="1356" y="542" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#065F46" fill-opacity=".22">Add your sticky notes here</text><rect x="1331" y="556" width="18" height="18" rx="2" fill="#FDE047" fill-opacity=".35"/><rect x="1363" y="556" width="18" height="18" rx="2" fill="#4ADE80" fill-opacity=".35"/>
<rect x="638" y="148" width="404" height="640" rx="10" fill="#FFEDD5" stroke="#9A3412" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M638,200 V158 A10,10 0 0 1 648,148 H1032 A10,10 0 0 1 1042,158 V200 Z" fill="#9A3412"/><circle cx="659" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="659" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">2</text><text x="682" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Discussing</text><text x="1026" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".6" letter-spacing=".10em">NOW</text>
<text x="656" y="236" font-family="'Instrument Serif',Georgia,serif" font-size="22" font-style="italic" fill="#9A3412">What are we discussing now?</text>
<text x="656" y="268" font-family="'Geist Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#9A3412" letter-spacing=".12em">CURRENT TOPIC</text>
<rect x="755" y="280" width="170" height="170" rx="6" fill="white" fill-opacity=".6" stroke="#9A3412" stroke-opacity=".35" stroke-dasharray="6,5" stroke-width="1.5"/>
<text x="840" y="360" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#9A3412" fill-opacity=".45">Place the top-voted</text>
<text x="840" y="374" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#9A3412" fill-opacity=".45">topic here</text>
<text x="656" y="484" font-family="'Geist Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#9A3412" letter-spacing=".12em">TIMEBOX (TICK EACH ROUND)</text>
<rect x="660" y="500" width="12" height="12" rx="2" fill="white" stroke="#9A3412" stroke-opacity=".6" stroke-width="1.2"/><text x="680" y="510" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#9A3412">8 min</text>
<rect x="780" y="500" width="12" height="12" rx="2" fill="white" stroke="#9A3412" stroke-opacity=".6" stroke-width="1.2"/><text x="800" y="510" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#9A3412">+ 4 min</text>
<rect x="900" y="500" width="12" height="12" rx="2" fill="white" stroke="#9A3412" stroke-opacity=".6" stroke-width="1.2"/><text x="920" y="510" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#9A3412">+ 2 min</text>
<text x="656" y="548" font-family="'Geist Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#9A3412" letter-spacing=".12em">WHEN THE TIMER ENDS, VOTE</text>
<circle cx="720.0" cy="586" r="20" fill="white" stroke="#14532D" stroke-opacity=".5" stroke-width="1.5"/>
<text x="720" y="593" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#14532D">↑</text>
<text x="720" y="624" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#14532D">Keep going</text>
<circle cx="840.0" cy="586" r="20" fill="white" stroke="#92400E" stroke-opacity=".5" stroke-width="1.5"/>
<text x="840" y="593" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#92400E">→</text>
<text x="840" y="624" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#92400E">Wrap up</text>
<circle cx="960.0" cy="586" r="20" fill="white" stroke="#991B1B" stroke-opacity=".5" stroke-width="1.5"/>
<text x="960" y="593" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#991B1B">↓</text>
<text x="960" y="624" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#991B1B">Move on</text>
<text x="840" y="644" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="9.5" font-style="italic" fill="#9A3412" fill-opacity=".7">Majority ↑ extends the timer · otherwise pull the next topic</text>
<line x1="648" y1="662" x2="1032" y2="662" stroke="#9A3412" stroke-width="1" stroke-opacity=".20" stroke-dasharray="5,4"/>
<text x="656" y="688" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#9A3412">Key takeaway:</text>
<line x1="656" y1="716" x2="1024" y2="716" stroke="#CBD5E1" stroke-width="1.5"/><line x1="656" y1="740" x2="1024" y2="740" stroke="#CBD5E1" stroke-width="1.5"/><line x1="656" y1="764" x2="1024" y2="764" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="24" y="800" width="318.4" height="52" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/>
<circle cx="48.0" cy="826" r="11" fill="#0C1A2E"/>
<text x="48" y="830" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="white">1</text>
<text x="68" y="821" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E293B">Brainstorm topics</text>
<text x="68" y="838" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#64748B">5 min · one topic per sticky</text>
<rect x="352.4" y="800" width="318.4" height="52" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/>
<circle cx="376.4" cy="826" r="11" fill="#0C1A2E"/>
<text x="376.4" y="830" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="white">2</text>
<text x="396.4" y="821" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E293B">Pitch &amp; dot-vote</text>
<text x="396.4" y="838" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#64748B">One sentence each · 3 dots per person</text>
<rect x="680.8" y="800" width="318.4" height="52" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/>
<circle cx="704.8" cy="826" r="11" fill="#0C1A2E"/>
<text x="704.8" y="830" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="white">3</text>
<text x="724.8" y="821" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E293B">Discuss the top topic</text>
<text x="724.8" y="838" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#64748B">Start the 8-minute timer</text>
<rect x="1009.2" y="800" width="318.4" height="52" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/>
<circle cx="1033.1999999999998" cy="826" r="11" fill="#0C1A2E"/>
<text x="1033.2" y="830" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="white">4</text>
<text x="1053.2" y="821" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E293B">Keep going or move on?</text>
<text x="1053.2" y="838" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#64748B">Vote ↑ → ↓ when time is up</text>
<rect x="1337.6" y="800" width="318.4" height="52" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/>
<circle cx="1361.6" cy="826" r="11" fill="#0C1A2E"/>
<text x="1361.6" y="830" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="white">5</text>
<text x="1381.6" y="821" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E293B">Capture takeaways</text>
<text x="1381.6" y="838" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#64748B">Green sticky, then move to Discussed</text>
<rect x="24" y="866" width="1632" height="32" rx="6" fill="#1E293B"/><rect x="24" y="866" width="6" height="32" rx="3" fill="#eb6c36"/><text x="840" y="887" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white" letter-spacing=".12em">TAKEAWAYS &amp; ACTIONS</text>
<rect x="24" y="906" width="534" height="154" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/><rect x="24" y="906" width="5" height="154" rx="3" fill="#eb6c36"/><text x="46" y="940" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E293B">Action #1</text><text x="46" y="978" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">Owner:</text><line x1="90.32" y1="982" x2="536" y2="982" stroke="#CBD5E1" stroke-width="1.5"/><text x="46" y="1014" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">Done when:</text><line x1="113.2" y1="1018" x2="536" y2="1018" stroke="#CBD5E1" stroke-width="1.5"/><line x1="46" y1="1048" x2="536" y2="1048" stroke="#E2E8F0" stroke-width="1.5"/><rect x="572" y="906" width="534" height="154" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/><rect x="572" y="906" width="5" height="154" rx="3" fill="#065F46"/><text x="594" y="940" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E293B">Action #2</text><text x="594" y="978" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">Owner:</text><line x1="638.32" y1="982" x2="1084" y2="982" stroke="#CBD5E1" stroke-width="1.5"/><text x="594" y="1014" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">Done when:</text><line x1="661.2" y1="1018" x2="1084" y2="1018" stroke="#CBD5E1" stroke-width="1.5"/><line x1="594" y1="1048" x2="1084" y2="1048" stroke="#E2E8F0" stroke-width="1.5"/><rect x="1120" y="906" width="534" height="154" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="url(#fsm)"/><rect x="1120" y="906" width="5" height="154" rx="3" fill="#1E3A8A"/><text x="1142" y="940" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#1E293B">Action #3</text><text x="1142" y="978" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">Owner:</text><line x1="1186.32" y1="982" x2="1632" y2="982" stroke="#CBD5E1" stroke-width="1.5"/><text x="1142" y="1014" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">Done when:</text><line x1="1209.2" y1="1018" x2="1632" y2="1018" stroke="#CBD5E1" stroke-width="1.5"/><line x1="1142" y1="1048" x2="1632" y2="1048" stroke="#E2E8F0" stroke-width="1.5"/>
<line x1="24" y1="1070" x2="1656" y2="1070" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“What's the most valuable thing we could talk about right now?”</text><line x1="832" y1="1078" x2="832" y2="1128" stroke="#E2E8F0" stroke-width="1"/><text x="848" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“Has this conversation run its course, or is there more value to unlock?”</text><text x="1656" y="1138" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#CBD5E1" letter-spacing=".08em">Lean Coffee · Participant-Driven Meetings · Facilitation Toolkit</text>
</svg>
