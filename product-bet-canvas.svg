<text x="598" y="596" font-family="'Geist',Inter,system-ui,sans-serif" font-size="9.5" fill="#92400E" fill-opacity=".88">Will they want it?</text>
<text x="598" y="628" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#92400E">Usability</text>
<text x="598" y="644" font-family="'Geist',Inter,system-ui,sans-serif" font-size="9.5" fill="#92400E" fill-opacity=".88">Can they use it?</text>
