<line x1="42" y1="588" x2="542" y2="588" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="620" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">Value to us:</text><line x1="120.64" y1="624" x2="542" y2="624" stroke="#CBD5E1" stroke-width="1.5"/>
