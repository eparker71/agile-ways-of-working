<text x="592" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#581C87">We believe that (who):</text><line x1="739.28" y1="238" x2="1638" y2="238" stroke="#CBD5E1" stroke-width="1.5"/>
