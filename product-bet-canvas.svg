<text x="42" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#991B1B">Who has it:</text><line x1="114.92" y1="238" x2="542" y2="238" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="268" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#991B1B">The problem, in their words:</text><line x1="212.16" y1="272" x2="542" y2="272" stroke="#CBD5E1" stroke-width="1.5"/>
