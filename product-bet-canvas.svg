<line x1="42" y1="374" x2="542" y2="374" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="404" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#991B1B">How often, how painful (1–5):</text><line x1="217.88" y1="408" x2="542" y2="408" stroke="#CBD5E1" stroke-width="1.5"/>
