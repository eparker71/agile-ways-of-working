<text x="592" y="302" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#581C87">if we (offer what):</text><line x1="720.56" y1="306" x2="1638" y2="306" stroke="#CBD5E1" stroke-width="1.5"/>
