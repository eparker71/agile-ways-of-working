  <title id="mg-title">Impediments Board</title>
  <desc id="mg-desc">A3 landscape impediments board: new, being worked, escalated and resolved columns, a four-step escalation ladder with time limits, and a resolved log.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
