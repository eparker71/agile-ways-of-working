<text x="66" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="white">Value</text>
<text x="40" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">Define value from the customer's point of view:</text><text x="40" y="249" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">what they would pay for, or miss if it were</text><text x="40" y="266" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">gone.</text>
<text x="40" y="301" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">ASK</text>
<text x="40" y="325" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#1E3A8A">“Who is this for, and what will change</text><text x="40" y="344" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#1E3A8A">for them?”</text>

<text x="368.8" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">Map every step from request to customer, and</text><text x="368.8" y="249" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">question each step that adds no value.</text>

<text x="723.6" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="white">Flow</text>
<text x="697.6" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">Make work move smoothly in small batches,</text><text x="697.6" y="249" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">without waiting, hand-offs or interruptions.</text>

<text x="697.6" y="308" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#0C4A6E">“Where does work wait, and why?”</text>

<text x="1031.4" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">4</text>
<text x="1052.4" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="white">Pull</text>
<text x="1026.4" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">Start new work only when there is capacity and</text><text x="1026.4" y="249" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">a real need, not because a plan said so.</text>
<text x="1026.4" y="284" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">ASK</text>
<text x="1026.4" y="308" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#065F46">“Are we starting more than we finish?”</text>
<line x1="1026.4" y1="418" x2="1311.2" y2="418" stroke="#065F46" stroke-width="1" stroke-opacity=".25"/>
<text x="1026.4" y="436" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">TOOLS IN THIS KIT</text>
<circle cx="1030.4" cy="456" r="2.5" fill="#065F46"/>

<circle cx="1030.4" cy="476" r="2.5" fill="#065F46"/>
<text x="1040.4" y="480" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#065F46">Buffering &amp; Swarming</text>
<text x="1333.2" y="338" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" fill="#1E293B" fill-opacity=".45">›</text>
<rect x="1339.2" y="148" width="316.8" height="380" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/>
<path d="M1339.2,200 V158 A10,10 0 0 1 1349.2,148 H1646.0 A10,10 0 0 1 1656.0,158 V200 Z" fill="#92400E"/>

<text x="1381.2" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="white">Perfection</text>
<text x="1355.2" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">Keep improving in small steps. There is always</text><text x="1355.2" y="249" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#1E293B">more waste to remove, so the work never ends.</text>
<text x="1355.2" y="284" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#92400E" letter-spacing=".12em">ASK</text>
<text x="1355.2" y="308" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#92400E">“What one small thing could we improve</text><text x="1355.2" y="327" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#92400E">this week?”</text>

<text x="248" y="667" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#566578">Moving parts between places</text>
<text x="648" y="667" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E293B">Hand-offs between people and teams</text>

<text x="648" y="713" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E293B">Partly done work: started, not finished</text>

<text x="648" y="851" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E293B">Features nobody asked for or uses</text>

<text x="648" y="897" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E293B">Gold-plating, extra reports, re-doing work</text>

<text x="648" y="943" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E293B">Bugs, misunderstood requirements, rework</text>
<text x="48" y="989" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#991B1B">Unused skills</text>
<text x="248" y="989" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" fill="#566578">Ignoring workers' ideas</text>
<text x="648" y="989" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E293B">Not using what people know, or can learn</text>
<text x="42" y="1038" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#991B1B" fill-opacity=".88">Taiichi Ohno named the first seven; unused skills was added later. Knowledge-work versions adapted from Mary and Tom Poppendieck, Lean Software Development.</text>
<rect x="1120" y="542" width="536" height="220" rx="10" fill="#F1F5F9" stroke="#334155" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1120,594 V552 A10,10 0 0 1 1130,542 H1646 A10,10 0 0 1 1656,552 V594 Z" fill="#334155"/><text x="1141" y="574" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Two Pillars</text><text x="1640" y="573" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">BOTH, NOT EITHER</text>
<text x="1138" y="626" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#334155">Continuous improvement</text>
<text x="1138" y="646" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Small, frequent changes by the people</text><text x="1138" y="662" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">who do the work (kaizen).</text>
<text x="1138" y="692" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#334155">Respect for people</text>
<text x="1138" y="712" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Trust people to solve problems, and</text><text x="1138" y="728" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">fix the system, not the person.</text>
<rect x="1120" y="776" width="536" height="284" rx="10" fill="#DCFCE7" stroke="#14532D" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1120,828 V786 A10,10 0 0 1 1130,776 H1646 A10,10 0 0 1 1656,786 V828 Z" fill="#14532D"/><text x="1141" y="808" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Lean Habits</text><text x="1640" y="807" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">TRY ONE THIS WEEK</text>
<text x="1138" y="860" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#14532D">Go and see</text>
<text x="1138" y="878" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Watch the work where it happens (gemba).</text>
<text x="1138" y="904" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#14532D">Stop and fix</text>
<text x="1138" y="922" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">When something goes wrong, fix the cause.</text>
<text x="1138" y="948" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#14532D">Make it visible</text>
<text x="1138" y="966" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Put the work and its problems on a board.</text>
<text x="1138" y="992" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#14532D">Small batches</text>
<text x="1138" y="1010" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Finish small pieces often, not big ones late.</text>
