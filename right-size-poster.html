<rect x="0" y="0" width="1680" height="1190" fill="url(#bg)"/><rect x="0" y="0" width="1680" height="4" fill="#eb6c36"/><rect x="0" y="4" width="1680" height="134" fill="#0C1A2E"/><text x="24" y="70" font-family="'Instrument Serif',Georgia,serif" font-size="42" font-weight="400" fill="white">Right-Size Your Structure</text><text x="24" y="100" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" fill="#94A3B8">How much structure a project needs as it grows from one team to many: just enough to stay safe, no more.</text><text x="24" y="120" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#8291A6" letter-spacing=".06em">Run a Project · Inspired by Brooks's law (Fred Brooks), Scrum's small teams, SAFe's release trains and Team Topologies</text><text x="1356" y="66" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">PROJECT</text><line x1="1452" y1="69" x2="1656" y2="69" stroke="#334155" stroke-width="1.2"/><text x="1356" y="96" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">DATE</text><line x1="1452" y1="99" x2="1656" y2="99" stroke="#334155" stroke-width="1.2"/>

<text x="42" y="228" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#065F46">3–10 people · 1 team</text>
<text x="42" y="246" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#065F46" fill-opacity=".88">4 people: 6 links</text>
<rect x="36" y="264" width="360.667" height="104.286" rx="6" fill="white" stroke="#065F46" stroke-opacity=".15"/>
<text x="48" y="282" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">PLANNING</text>
<text x="48" y="300" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">A short planning conversation each iteration, and a simple</text><text x="48" y="315" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">roadmap.</text>
<text x="48" y="334" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#065F46">Sprint Planning · Prioritisation Board</text>
<rect x="36" y="376.286" width="360.667" height="104.286" rx="6" fill="white" stroke="#065F46" stroke-opacity=".15"/>
<text x="48" y="394.286" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">ROLES</text>
<text x="48" y="412.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">A product owner or lead sets priorities; the team shares the</text><text x="48" y="427.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">rest.</text>
<text x="48" y="446.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#065F46">Team Charter</text>
<rect x="36" y="488.571" width="360.667" height="104.286" rx="6" fill="white" stroke="#065F46" stroke-opacity=".15"/>
<text x="48" y="506.571" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">EVENTS</text>
<text x="48" y="524.571" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Daily sync, planning, review and retro, kept short.</text>
<text x="48" y="543.571" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#065F46">Events &amp; Cadences</text>
<rect x="36" y="600.857" width="360.667" height="104.286" rx="6" fill="white" stroke="#065F46" stroke-opacity=".15"/>
<text x="48" y="618.857" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">TRACKING WORK</text>
<text x="48" y="636.857" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">One visible board. Conversation fills the gaps.</text>
<text x="48" y="655.857" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#065F46">Kanban Board Design</text>
<rect x="36" y="713.143" width="360.667" height="104.286" rx="6" fill="white" stroke="#065F46" stroke-opacity=".15"/>
<text x="48" y="731.143" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">RISKS &amp; DEPENDENCIES</text>
<text x="48" y="749.143" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Raise them in the daily sync and planning; note the big</text><text x="48" y="764.143" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">ones.</text>
<text x="48" y="783.143" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#065F46">Pre-mortem</text>
<rect x="36" y="825.429" width="360.667" height="104.286" rx="6" fill="white" stroke="#065F46" stroke-opacity=".15"/>
<text x="48" y="843.429" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">REPORTING</text>
<text x="48" y="861.429" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Show working software at the review, plus a short note to</text><text x="48" y="876.429" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">the sponsor.</text>
<text x="48" y="895.429" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#065F46">Sprint Review</text>
<rect x="36" y="937.714" width="360.667" height="104.286" rx="6" fill="white" stroke="#065F46" stroke-opacity=".15"/>
<text x="48" y="955.714" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#065F46" letter-spacing=".12em">DECISIONS &amp; GOVERNANCE</text>
<text x="48" y="973.714" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Decide in the room. Write down only what people will ask</text><text x="48" y="988.714" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">about later.</text>
<text x="48" y="1007.71" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#065F46">Team Charter (How We Decide)</text>
<text x="415.667" y="178" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="16" fill="#1E293B" fill-opacity=".45">›</text>
<rect x="422.667" y="148" width="384.667" height="912" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M422.6666666666667,200 V158 A10,10 0 0 1 432.6666666666667,148 H797.3333333333334 A10,10 0 0 1 807.3333333333334,158 V200 Z" fill="#1E3A8A"/><circle cx="443.6666666666667" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="443.667" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">2</text><text x="466.667" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Team of Teams</text><text x="791.333" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">LEVEL 2</text>
<text x="440.667" y="228" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1E3A8A">10–50 people · 2–5 teams</text>
<text x="440.667" y="246" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#1E3A8A" fill-opacity=".88">40 people: 780 links</text>
<rect x="434.667" y="264" width="360.667" height="104.286" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".15"/>
<text x="446.667" y="282" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">PLANNING</text>
<text x="446.667" y="300" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Plan together each planning period, with shared objectives.</text>
<text x="446.667" y="319" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">Cross-Team Planning · OKRs</text>
<rect x="434.667" y="376.286" width="360.667" height="104.286" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".15"/>
<text x="446.667" y="394.286" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">ROLES</text>
<text x="446.667" y="412.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Add a programme manager or RTE to coordinate, and one</text><text x="446.667" y="427.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">product lead across teams.</text>
<text x="446.667" y="446.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">RACI &amp; Decision Log</text>
<rect x="434.667" y="488.571" width="360.667" height="104.286" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".15"/>
<text x="446.667" y="506.571" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">EVENTS</text>
<text x="446.667" y="524.571" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Add a weekly cross-team sync, a joint demo and a joint</text><text x="446.667" y="539.571" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">retro.</text>
<text x="446.667" y="558.571" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">Cross-Team Sync · Cross-Team Retro</text>
<rect x="434.667" y="600.857" width="360.667" height="104.286" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".15"/>
<text x="446.667" y="618.857" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">TRACKING WORK</text>
<text x="446.667" y="636.857" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">A shared view of features across teams; each team keeps its</text><text x="446.667" y="651.857" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">own board.</text>
<text x="446.667" y="670.857" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">Dependency Map</text>
<rect x="434.667" y="713.143" width="360.667" height="104.286" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".15"/>
<text x="446.667" y="731.143" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">RISKS &amp; DEPENDENCIES</text>
<text x="446.667" y="749.143" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">A shared RAID log and dependency map, reviewed every week.</text>
<text x="446.667" y="768.143" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">RAID Log · Dependency Map</text>
<rect x="434.667" y="825.429" width="360.667" height="104.286" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".15"/>
<text x="446.667" y="843.429" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">REPORTING</text>
<text x="446.667" y="861.429" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">A one-page outcome status report and a forecast range.</text>
<text x="446.667" y="880.429" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">Outcome Status Report · Release Forecast</text>
<rect x="434.667" y="937.714" width="360.667" height="104.286" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".15"/>
<text x="446.667" y="955.714" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">DECISIONS &amp; GOVERNANCE</text>
<text x="446.667" y="973.714" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">A decision log, a shared Definition of Done and clear</text><text x="446.667" y="988.714" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">decision rights.</text>
<text x="446.667" y="1007.71" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#1E3A8A">RACI &amp; Decision Log · Delegation Board</text>
<text x="814.333" y="178" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="16" fill="#1E293B" fill-opacity=".45">›</text>
<rect x="821.333" y="148" width="384.667" height="912" rx="10" fill="#EDE9FE" stroke="#581C87" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M821.3333333333334,200 V158 A10,10 0 0 1 831.3333333333334,148 H1196.0 A10,10 0 0 1 1206.0,158 V200 Z" fill="#581C87"/><circle cx="842.3333333333334" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="842.333" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">3</text><text x="865.333" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Programme</text><text x="1190" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">LEVEL 3</text>
<text x="839.333" y="228" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#581C87">50+ people · many teams</text>
<text x="839.333" y="246" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#581C87" fill-opacity=".88">120 people: 7,140 links</text>
<rect x="833.333" y="264" width="360.667" height="104.286" rx="6" fill="white" stroke="#581C87" stroke-opacity=".15"/>
<text x="845.333" y="282" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#581C87" letter-spacing=".12em">PLANNING</text>
<text x="845.333" y="300" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Outcomes set at the top; big-room planning for each group of</text><text x="845.333" y="315" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">teams.</text>
<text x="845.333" y="334" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#581C87">OKRs · Portfolio Kanban</text>
<rect x="833.333" y="376.286" width="360.667" height="104.286" rx="6" fill="white" stroke="#581C87" stroke-opacity=".15"/>
<text x="845.333" y="394.286" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#581C87" letter-spacing=".12em">ROLES</text>
<text x="845.333" y="412.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Programme and portfolio leads, an RTE per group of teams,</text><text x="845.333" y="427.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">architecture and product leads.</text>
<text x="845.333" y="446.286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#581C87">Team Topology Design</text>
<rect x="833.333" y="488.571" width="360.667" height="104.286" rx="6" fill="white" stroke="#581C87" stroke-opacity=".15"/>
<text x="845.333" y="506.571" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#581C87" letter-spacing=".12em">EVENTS</text>
<text x="845.333" y="524.571" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Add portfolio reviews, and inspect &amp; adapt across the whole</text><text x="845.333" y="539.571" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">programme.</text>
