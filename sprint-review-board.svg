  <title id="mg-title">Sprint Review</title>
  <desc id="mg-desc">A3 landscape sprint review board: sprint goal and result, key measures, what was built, stakeholder feedback, changes in context, backlog changes (add, change, remove), and next steps.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
