<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1190" width="1680" height="1190" role="img" aria-labelledby="mg-title mg-desc">
  <title id="mg-title">A3 Problem-Solving</title>
  <desc id="mg-desc">A3 landscape problem-solving report in the lean A3 format: background, current condition, goal and root cause on the plan side; countermeasures, plan, check and follow-up on the do, check and act side.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="fc" x="-4%" y="-4%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <filter id="fsm" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1.2" fill="#000" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1680" height="1190" fill="url(#bg)"/><rect x="0" y="0" width="1680" height="4" fill="#eb6c36"/><rect x="0" y="4" width="1680" height="134" fill="#0C1A2E"/><text x="24" y="70" font-family="'Instrument Serif',Georgia,serif" font-size="42" font-weight="400" fill="white">A3 Problem-Solving</text><text x="24" y="100" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" fill="#94A3B8">Work through one problem on one sheet: understand it, find the root cause, test countermeasures and make the fix stick.</text><text x="24" y="120" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#8291A6" letter-spacing=".06em">Reflect &amp; Improve · A3 Thinking (Toyota) · Plan · Do · Check · Act · Inspired by John Shook, Managing to Learn</text><text x="1356" y="66" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">PROBLEM</text><line x1="1452" y1="69" x2="1656" y2="69" stroke="#334155" stroke-width="1.2"/><text x="1356" y="96" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">OWNER</text><line x1="1452" y1="99" x2="1656" y2="99" stroke="#334155" stroke-width="1.2"/><text x="1356" y="126" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">DATE</text><line x1="1452" y1="129" x2="1656" y2="129" stroke="#334155" stroke-width="1.2"/>
<rect x="24" y="148" width="808" height="170" rx="10" fill="#F1F5F9" stroke="#334155" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,200 V158 A10,10 0 0 1 34,148 H822 A10,10 0 0 1 832,158 V200 Z" fill="#334155"/><circle cx="45" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="45" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">1</text><text x="68" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Background</text><text x="816" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">PLAN · WHY THIS MATTERS, AND TO WHOM</text>
<line x1="42" y1="240" x2="814" y2="240" stroke="#CBD5E1" stroke-width="1.5"/><line x1="42" y1="266" x2="814" y2="266" stroke="#CBD5E1" stroke-width="1.5"/><line x1="42" y1="292" x2="814" y2="292" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="24" y="332" width="808" height="300" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,384 V342 A10,10 0 0 1 34,332 H822 A10,10 0 0 1 832,342 V384 Z" fill="#1E3A8A"/><circle cx="45" cy="358" r="12" fill="white" fill-opacity=".18"/><text x="45" y="363" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">2</text><text x="68" y="364" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Current Condition</text><text x="816" y="363" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">PLAN · FACTS, DATA OR A SKETCH, NOT OPINIONS</text>
<text x="42" y="412" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-style="italic" fill="#1E3A8A" fill-opacity=".88">What's happening now? Go and see the work, then draw or chart it.</text>
<rect x="34" y="424" width="788" height="158" rx="6" fill="url(#dots)"/><text x="428" y="497" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#1E3A8A" fill-opacity=".22">Sketch, chart or stickies</text><rect x="403" y="511" width="18" height="18" rx="2" fill="#FDE047" fill-opacity=".35"/><rect x="435" y="511" width="18" height="18" rx="2" fill="#F9A8D4" fill-opacity=".35"/>
<text x="42" y="610" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E3A8A">The measure today:</text><line x1="154.96" y1="614" x2="814" y2="614" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="24" y="646" width="808" height="130" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,698 V656 A10,10 0 0 1 34,646 H822 A10,10 0 0 1 832,656 V698 Z" fill="#065F46"/><circle cx="45" cy="672" r="12" fill="white" fill-opacity=".18"/><text x="45" y="677" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">3</text><text x="68" y="678" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Goal</text><text x="816" y="677" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">PLAN · WHAT GOOD LOOKS LIKE</text>
<text x="42" y="730" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">Target:</text><line x1="92.04" y1="734" x2="544" y2="734" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="564" y="730" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">By when:</text><line x1="619.76" y1="734" x2="814" y2="734" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="760" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">We'll measure it by:</text><line x1="166.4" y1="764" x2="814" y2="764" stroke="#CBD5E1" stroke-width="1.5"/>
