<text x="42" y="876" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#581C87">Why 1?</text><line x1="86.32" y1="880" x2="814" y2="880" stroke="#CBD5E1" stroke-width="1.5"/>
