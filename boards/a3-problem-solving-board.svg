<rect x="846" y="726" width="810" height="140" rx="10" fill="#E0F2FE" stroke="#0C4A6E" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M846,778 V736 A10,10 0 0 1 856,726 H1646 A10,10 0 0 1 1656,736 V778 Z" fill="#0C4A6E"/><circle cx="867" cy="752" r="12" fill="white" fill-opacity=".18"/><text x="867" y="757" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">7</text><text x="890" y="758" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Check</text><text x="1640" y="757" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">CHECK · DID IT WORK?</text>
<text x="864" y="812" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#0C4A6E">Result against the target:</text><line x1="1022.72" y1="816" x2="1638" y2="816" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="864" y="844" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#0C4A6E">What we learned:</text><line x1="965.52" y1="848" x2="1638" y2="848" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="846" y="880" width="810" height="180" rx="10" fill="#DCFCE7" stroke="#14532D" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M846,932 V890 A10,10 0 0 1 856,880 H1646 A10,10 0 0 1 1656,890 V932 Z" fill="#14532D"/><circle cx="867" cy="906" r="12" fill="white" fill-opacity=".18"/><text x="867" y="911" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">8</text><text x="890" y="912" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Follow-up</text><text x="1640" y="911" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">ACT · MAKE IT STICK, OR TRY AGAIN</text>
<rect x="864" y="956" width="12" height="12" rx="2" fill="white" stroke="#14532D" stroke-opacity=".6" stroke-width="1.2"/><text x="884" y="966" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Make it the standard way of working</text>
<rect x="1254" y="956" width="12" height="12" rx="2" fill="white" stroke="#14532D" stroke-opacity=".6" stroke-width="1.2"/><text x="1274" y="966" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Try another countermeasure</text>
<rect x="864" y="986" width="12" height="12" rx="2" fill="white" stroke="#14532D" stroke-opacity=".6" stroke-width="1.2"/><text x="884" y="996" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Share it with teams who have the same problem</text>
<rect x="1254" y="986" width="12" height="12" rx="2" fill="white" stroke="#14532D" stroke-opacity=".6" stroke-width="1.2"/><text x="1274" y="996" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Close the A3</text>
<text x="864" y="1038" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Share with:</text><line x1="936.92" y1="1042" x2="1638" y2="1042" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="24" y1="1070" x2="1656" y2="1070" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“What's really happening, and have we gone to see it?”</text><line x1="832" y1="1078" x2="832" y2="1128" stroke="#E2E8F0" stroke-width="1"/><text x="848" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“Which cause, if we removed it, would stop the problem coming back?”</text><text x="1656" y="1138" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#5B6B82" letter-spacing=".08em">Reflect &amp; Improve · A3 Thinking · Plan · Do · Check · Act</text><text x="24" y="1138" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#5B6B82" letter-spacing=".06em">© 2026 Eric Parker · CC BY 4.0 · eparker71.github.io/better-delivery-toolkit</text>
