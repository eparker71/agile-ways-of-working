<text x="42" y="944" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#581C87">Why 3?</text><line x1="86.32" y1="948" x2="814" y2="948" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="42" y="978" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#581C87">Why 4?</text><line x1="86.32" y1="982" x2="814" y2="982" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="38" y="998" width="780" height="48" rx="6" fill="#EDE9FE" stroke="#581C87" stroke-opacity=".4" stroke-width="1.5"/>
<text x="52" y="1028" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#581C87">Root cause:</text><line x1="130.64" y1="1032" x2="804" y2="1032" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="846" y="148" width="810" height="300" rx="10" fill="#FFEDD5" stroke="#9A3412" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M846,200 V158 A10,10 0 0 1 856,148 H1646 A10,10 0 0 1 1656,158 V200 Z" fill="#9A3412"/><circle cx="867" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="867" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">5</text><text x="890" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Countermeasures</text><text x="1640" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">DO · SMALL CHANGES THAT TACKLE THE CAUSE</text>
<text x="870" y="232" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#9A3412" letter-spacing=".1em">COUNTERMEASURE</text><text x="1250" y="232" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#9A3412" letter-spacing=".1em">WHICH CAUSE IT TACKLES</text><text x="1520" y="232" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#9A3412" letter-spacing=".1em">EFFORT S/M/L</text><line x1="864" y1="242" x2="1638" y2="242" stroke="#9A3412" stroke-width="1.2" stroke-opacity=".35"/><line x1="864" y1="282" x2="1638" y2="282" stroke="#CBD5E1" stroke-width="1.5"/><line x1="864" y1="322" x2="1638" y2="322" stroke="#CBD5E1" stroke-width="1.5"/><line x1="864" y1="362" x2="1638" y2="362" stroke="#CBD5E1" stroke-width="1.5"/><line x1="864" y1="402" x2="1638" y2="402" stroke="#CBD5E1" stroke-width="1.5"/><line x1="864" y1="442" x2="1638" y2="442" stroke="#CBD5E1" stroke-width="1.5"/><line x1="1244" y1="220" x2="1244" y2="442" stroke="#9A3412" stroke-width="1" stroke-opacity=".15"/><line x1="1514" y1="220" x2="1514" y2="442" stroke="#9A3412" stroke-width="1" stroke-opacity=".15"/>
