<text x="42" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">Start: help everyone arrive</text><text x="42" y="247" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">and speak once early.</text>
<text x="42" y="272" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#334155" letter-spacing=".12em">HOW</text>
<text x="42" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#334155">1.</text>
<text x="58" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Ask one light question</text>
<text x="42" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#334155">2.</text>
<text x="58" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Go round, a sentence each</text>

<text x="58" y="326" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">No discussion yet</text>

<text x="453" y="214" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#581C87" letter-spacing=".12em">WHEN</text>
<text x="453" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#581C87">Before discussing, so ideas</text><text x="453" y="247" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#581C87">aren't shaped by the loudest.</text>
<text x="453" y="272" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#581C87" letter-spacing=".12em">HOW</text>
<text x="453" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#581C87">1.</text>
<text x="469" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Pose one clear question</text>
<text x="453" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#581C87">2.</text>
<text x="469" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Everyone writes alone, 3–5 min</text>
<text x="453" y="326" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#581C87">3.</text>
<text x="469" y="326" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">One idea per sticky</text>
<line x1="453" y1="354" x2="816" y2="354" stroke="#581C87" stroke-width="1" stroke-opacity=".2"/>
<text x="453" y="376" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-style="italic" fill="#581C87">Quiet people contribute as much as anyone.</text>

<text x="864" y="214" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">WHEN</text>
<text x="864" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E3A8A">To deepen ideas before the</text><text x="864" y="247" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E3A8A">whole group hears them.</text>
<text x="864" y="272" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">HOW</text>
<text x="864" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#1E3A8A">1.</text>
<text x="880" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Think alone for a minute</text>
<text x="864" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#1E3A8A">2.</text>
<text x="880" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Discuss in pairs</text>
<text x="864" y="326" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#1E3A8A">3.</text>
<text x="880" y="326" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Pairs share with the group</text>
<line x1="864" y1="354" x2="1227" y2="354" stroke="#1E3A8A" stroke-width="1" stroke-opacity=".2"/>

<text x="1275" y="214" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#0C4A6E" letter-spacing=".12em">WHEN</text>
<text x="1275" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#0C4A6E">When a few voices dominate,</text><text x="1275" y="247" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#0C4A6E">or you need every view.</text>
<text x="1275" y="272" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#0C4A6E" letter-spacing=".12em">HOW</text>
<text x="1275" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#0C4A6E">1.</text>
<text x="1291" y="292" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Go round in order</text>
<text x="1275" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#0C4A6E">2.</text>
<text x="1291" y="309" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Each person speaks briefly</text>
<text x="1275" y="326" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#0C4A6E">3.</text>
<text x="1291" y="326" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">“Pass” is always allowed</text>
<line x1="1275" y1="354" x2="1638" y2="354" stroke="#0C4A6E" stroke-width="1" stroke-opacity=".2"/>
<text x="1275" y="376" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-style="italic" fill="#0C4A6E">Equal airtime, without putting people on the spot.</text>

<text x="42" y="478" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#065F46" letter-spacing=".12em">WHEN</text>
<text x="42" y="496" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">To make sense of many</text><text x="42" y="511" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">ideas quickly.</text>
<text x="42" y="536" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#065F46" letter-spacing=".12em">HOW</text>
<text x="42" y="556" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#065F46">1.</text>
<text x="58" y="556" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Put all stickies up</text>
<text x="42" y="573" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#065F46">2.</text>
<text x="58" y="573" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Move similar ones together, silently</text>
<text x="42" y="590" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#065F46">3.</text>
<text x="58" y="590" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Name each cluster</text>
<line x1="42" y1="618" x2="405" y2="618" stroke="#065F46" stroke-width="1" stroke-opacity=".2"/>
<text x="42" y="640" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-style="italic" fill="#065F46">Silent moving avoids arguments about wording.</text>

<text x="457" y="438" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="white">6</text>
<text x="477" y="440" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Dot Voting</text>
<text x="453" y="478" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#9A3412" letter-spacing=".12em">WHEN</text>
<text x="453" y="496" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#9A3412">To prioritise a list in</text><text x="453" y="511" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#9A3412">minutes.</text>
<text x="453" y="536" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#9A3412" letter-spacing=".12em">HOW</text>
<text x="453" y="556" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#9A3412">1.</text>
<text x="469" y="556" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Give each person 3 dots</text>
<text x="453" y="573" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#9A3412">2.</text>
<text x="469" y="573" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Vote at the same time</text>
<text x="453" y="590" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#9A3412">3.</text>
<text x="469" y="590" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Count, then discuss the top items</text>
<line x1="453" y1="618" x2="816" y2="618" stroke="#9A3412" stroke-width="1" stroke-opacity=".2"/>
<text x="453" y="640" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-style="italic" fill="#9A3412">Vote together, so no one follows the leader.</text>

<text x="868" y="438" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="white">7</text>
<text x="888" y="440" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Fist of Five</text>
<text x="864" y="478" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#14532D" letter-spacing=".12em">WHEN</text>
<text x="864" y="496" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">To check support for a</text><text x="864" y="511" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">proposal or plan.</text>
<text x="864" y="536" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#14532D" letter-spacing=".12em">HOW</text>
<text x="864" y="556" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#14532D">1.</text>
<text x="880" y="556" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Everyone shows 0–5 fingers</text>

<text x="880" y="573" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E293B">Ask the lowest votes what's missing</text>
