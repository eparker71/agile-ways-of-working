<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1190" width="1680" height="1190" role="img" aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Feedback Conversation</title>
  <desc id="mg-desc">A3 landscape board for preparing and holding a feedback conversation: a self-check, situation, behaviour, impact and request with examples, questions to hear the other side, agreed next steps, and using the same shape for praise.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="fc" x="-4%" y="-4%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <filter id="fsm" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1.2" fill="#000" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1680" height="1190" fill="url(#bg)"/><rect x="0" y="0" width="1680" height="4" fill="#eb6c36"/><rect x="0" y="4" width="1680" height="134" fill="#0C1A2E"/><text x="24" y="70" font-family="'Instrument Serif',Georgia,serif" font-size="42" font-weight="400" fill="white">Feedback Conversation</text><text x="24" y="100" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" fill="#94A3B8">Prepare and hold one feedback conversation: describe what happened and its effect, listen, and agree what happens next.</text><text x="24" y="120" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#8291A6" letter-spacing=".06em">Facilitate &amp; Coach · Situation–Behaviour–Impact (Center for Creative Leadership) · Feedback Both Ways</text><text x="1356" y="66" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">WITH</text><line x1="1452" y1="69" x2="1656" y2="69" stroke="#334155" stroke-width="1.2"/><text x="1356" y="96" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">DATE</text><line x1="1452" y1="99" x2="1656" y2="99" stroke="#334155" stroke-width="1.2"/>
<rect x="24" y="148" width="1632" height="150" rx="10" fill="#F1F5F9" stroke="#334155" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,200 V158 A10,10 0 0 1 34,148 H1646 A10,10 0 0 1 1656,158 V200 Z" fill="#334155"/><circle cx="45" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="45" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">1</text><text x="68" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Check Yourself First</text><text x="1640" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">BEFORE YOU BOOK IT</text>
<rect x="42" y="224" width="12" height="12" rx="2" fill="white" stroke="#334155" stroke-opacity=".6" stroke-width="1.2"/><text x="62" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">My intent is to help, not to win</text>
<rect x="364" y="224" width="12" height="12" rx="2" fill="white" stroke="#334155" stroke-opacity=".6" stroke-width="1.2"/><text x="384" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">It's recent and specific</text>
<rect x="686" y="224" width="12" height="12" rx="2" fill="white" stroke="#334155" stroke-opacity=".6" stroke-width="1.2"/><text x="706" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">I'll say it in private</text>
<rect x="1008" y="224" width="12" height="12" rx="2" fill="white" stroke="#334155" stroke-opacity=".6" stroke-width="1.2"/><text x="1028" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">I'm ready to listen, too</text>
<rect x="1330" y="224" width="12" height="12" rx="2" fill="white" stroke="#334155" stroke-opacity=".6" stroke-width="1.2"/><text x="1350" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">It's a good time for them</text>
<text x="42" y="270" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">What I want for them from this conversation:</text><line x1="303.68" y1="274" x2="1638" y2="274" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="24" y="312" width="1082" height="440" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,364 V322 A10,10 0 0 1 34,312 H1096 A10,10 0 0 1 1106,322 V364 Z" fill="#1E3A8A"/><circle cx="45" cy="338" r="12" fill="white" fill-opacity=".18"/><text x="45" y="343" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">2</text><text x="68" y="344" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Prepare It</text><text x="1090" y="343" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">SITUATION · BEHAVIOUR · IMPACT · REQUEST</text>
<rect x="38" y="376" width="256" height="362" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".2"/>
<circle cx="60" cy="400" r="11" fill="#1E3A8A"/>
<text x="60" y="404" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="white">S</text>
<text x="78" y="405" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E3A8A">Situation</text>
<text x="52" y="434" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">When and where. Recent,</text><text x="52" y="449" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">specific and factual.</text>
<text x="52" y="480" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">“In Tuesday's review…”</text>
<text x="52" y="548" font-family="'Geist',Inter,system-ui,sans-serif" font-size="9.5" fill="#1E3A8A" fill-opacity=".88">What I'll say:</text>
<line x1="52" y1="576" x2="280" y2="576" stroke="#CBD5E1" stroke-width="1.5"/><line x1="52" y1="602" x2="280" y2="602" stroke="#CBD5E1" stroke-width="1.5"/><line x1="52" y1="628" x2="280" y2="628" stroke="#CBD5E1" stroke-width="1.5"/><line x1="52" y1="654" x2="280" y2="654" stroke="#CBD5E1" stroke-width="1.5"/><line x1="52" y1="680" x2="280" y2="680" stroke="#CBD5E1" stroke-width="1.5"/><line x1="52" y1="706" x2="280" y2="706" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="304" y="376" width="256" height="362" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".2"/>
<circle cx="326" cy="400" r="11" fill="#1E3A8A"/>
<text x="326" y="404" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="white">B</text>
<text x="344" y="405" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E3A8A">Behaviour</text>
<text x="318" y="434" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">What you saw or heard.</text><text x="318" y="449" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">No labels, no guesses.</text>
<text x="318" y="480" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">“…you cut Priya off</text><text x="318" y="498" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">twice…”</text>
<text x="318" y="548" font-family="'Geist',Inter,system-ui,sans-serif" font-size="9.5" fill="#1E3A8A" fill-opacity=".88">What I'll say:</text>
<line x1="318" y1="576" x2="546" y2="576" stroke="#CBD5E1" stroke-width="1.5"/><line x1="318" y1="602" x2="546" y2="602" stroke="#CBD5E1" stroke-width="1.5"/><line x1="318" y1="628" x2="546" y2="628" stroke="#CBD5E1" stroke-width="1.5"/><line x1="318" y1="654" x2="546" y2="654" stroke="#CBD5E1" stroke-width="1.5"/><line x1="318" y1="680" x2="546" y2="680" stroke="#CBD5E1" stroke-width="1.5"/><line x1="318" y1="706" x2="546" y2="706" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="570" y="376" width="256" height="362" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".2"/>
<circle cx="592" cy="400" r="11" fill="#1E3A8A"/>
<text x="592" y="404" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="white">I</text>
<text x="610" y="405" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E3A8A">Impact</text>
<text x="584" y="434" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">The effect on you, the</text><text x="584" y="449" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">team or the work.</text>
<text x="584" y="480" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">“…and we didn't hear</text><text x="584" y="498" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">her view on the risk.”</text>
<text x="584" y="548" font-family="'Geist',Inter,system-ui,sans-serif" font-size="9.5" fill="#1E3A8A" fill-opacity=".88">What I'll say:</text>
<line x1="584" y1="576" x2="812" y2="576" stroke="#CBD5E1" stroke-width="1.5"/><line x1="584" y1="602" x2="812" y2="602" stroke="#CBD5E1" stroke-width="1.5"/><line x1="584" y1="628" x2="812" y2="628" stroke="#CBD5E1" stroke-width="1.5"/><line x1="584" y1="654" x2="812" y2="654" stroke="#CBD5E1" stroke-width="1.5"/><line x1="584" y1="680" x2="812" y2="680" stroke="#CBD5E1" stroke-width="1.5"/><line x1="584" y1="706" x2="812" y2="706" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="836" y="376" width="256" height="362" rx="6" fill="white" stroke="#1E3A8A" stroke-opacity=".2"/>
<circle cx="858" cy="400" r="11" fill="#1E3A8A"/>
<text x="858" y="404" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="white">R</text>
<text x="876" y="405" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#1E3A8A">Request</text>
<text x="850" y="434" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">What you'd like next,</text><text x="850" y="449" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A">then ask for their view.</text>
<text x="850" y="480" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">“Could you let people</text><text x="850" y="498" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">finish? How did it seem</text><text x="850" y="516" font-family="'Instrument Serif',Georgia,serif" font-size="12.5" font-style="italic" fill="#1E3A8A">to you?”</text>
<text x="850" y="548" font-family="'Geist',Inter,system-ui,sans-serif" font-size="9.5" fill="#1E3A8A" fill-opacity=".88">What I'll say:</text>
<line x1="850" y1="576" x2="1078" y2="576" stroke="#CBD5E1" stroke-width="1.5"/><line x1="850" y1="602" x2="1078" y2="602" stroke="#CBD5E1" stroke-width="1.5"/><line x1="850" y1="628" x2="1078" y2="628" stroke="#CBD5E1" stroke-width="1.5"/><line x1="850" y1="654" x2="1078" y2="654" stroke="#CBD5E1" stroke-width="1.5"/><line x1="850" y1="680" x2="1078" y2="680" stroke="#CBD5E1" stroke-width="1.5"/><line x1="850" y1="706" x2="1078" y2="706" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="1120" y="312" width="536" height="440" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1120,364 V322 A10,10 0 0 1 1130,312 H1646 A10,10 0 0 1 1656,322 V364 Z" fill="#065F46"/><circle cx="1141" cy="338" r="12" fill="white" fill-opacity=".18"/><text x="1141" y="343" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">3</text><text x="1164" y="344" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Hear It Back</text><text x="1640" y="343" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">IT'S A CONVERSATION</text>
<text x="1138" y="392" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#065F46" letter-spacing=".12em">QUESTIONS TO ASK</text>
<text x="1138" y="418" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#065F46">“How did it look from your side?”</text>
<text x="1138" y="442" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#065F46">“What did I miss?”</text>
<text x="1138" y="466" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-style="italic" fill="#065F46">“What would help?”</text>
<text x="1138" y="512" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">Their view:</text><line x1="1210.92" y1="516" x2="1638" y2="516" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="544" x2="1638" y2="544" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="572" x2="1638" y2="572" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="596" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">What I learned:</text><line x1="1233.8" y1="600" x2="1638" y2="600" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="628" x2="1638" y2="628" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="656" x2="1638" y2="656" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="680" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">Feedback for me:</text><line x1="1239.52" y1="684" x2="1638" y2="684" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="712" x2="1638" y2="712" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="24" y="766" width="808" height="294" rx="10" fill="#DCFCE7" stroke="#14532D" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,818 V776 A10,10 0 0 1 34,766 H822 A10,10 0 0 1 832,776 V818 Z" fill="#14532D"/><circle cx="45" cy="792" r="12" fill="white" fill-opacity=".18"/><text x="45" y="797" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">4</text><text x="68" y="798" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Agree Next Steps</text><text x="816" y="797" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">BOTH OF US</text>
<text x="48" y="852" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#14532D" letter-spacing=".1em">WHO</text><text x="198" y="852" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#14532D" letter-spacing=".1em">WILL DO</text><text x="638" y="852" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#14532D" letter-spacing=".1em">BY WHEN</text><line x1="42" y1="862" x2="814" y2="862" stroke="#14532D" stroke-width="1.2" stroke-opacity=".35"/><line x1="42" y1="896" x2="814" y2="896" stroke="#CBD5E1" stroke-width="1.5"/><line x1="42" y1="930" x2="814" y2="930" stroke="#CBD5E1" stroke-width="1.5"/><line x1="42" y1="964" x2="814" y2="964" stroke="#CBD5E1" stroke-width="1.5"/><line x1="42" y1="998" x2="814" y2="998" stroke="#CBD5E1" stroke-width="1.5"/><line x1="192" y1="840" x2="192" y2="998" stroke="#14532D" stroke-width="1" stroke-opacity=".15"/><line x1="632" y1="840" x2="632" y2="998" stroke="#14532D" stroke-width="1" stroke-opacity=".15"/>
<text x="42" y="1030" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">We'll check in on:</text><line x1="154.96" y1="1034" x2="814" y2="1034" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="846" y="766" width="810" height="294" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M846,818 V776 A10,10 0 0 1 856,766 H1646 A10,10 0 0 1 1656,776 V818 Z" fill="#92400E"/><circle cx="867" cy="792" r="12" fill="white" fill-opacity=".18"/><text x="867" y="797" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">5</text><text x="890" y="798" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Praise Works the Same Way</text><text x="1640" y="797" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">SAY WHAT WENT WELL, SPECIFICALLY</text>
<text x="864" y="852" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#92400E">Situation:</text><line x1="931.2" y1="856" x2="1638" y2="856" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="864" y="888" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#92400E">Behaviour:</text><line x1="931.2" y1="892" x2="1638" y2="892" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="864" y="924" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#92400E">Impact:</text><line x1="914.04" y1="928" x2="1638" y2="928" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="864" y="976" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#92400E" letter-spacing=".12em">RECEIVING FEEDBACK</text>
<text x="864" y="1002" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#92400E">Listen to the end · Ask to understand, not to defend · Say thank you</text>
<text x="864" y="1024" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#92400E">Then decide what you'll do with it, in your own time.</text>
<line x1="24" y1="1070" x2="1656" y2="1070" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“Did I describe what happened, or judge who they are?”</text><line x1="832" y1="1078" x2="832" y2="1128" stroke="#E2E8F0" stroke-width="1"/><text x="848" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“What would I want to know if it were me?”</text><text x="1656" y="1138" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#5B6B82" letter-spacing=".08em">Facilitate &amp; Coach · Feedback · Kind, Clear, Specific</text><text x="24" y="1138" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#5B6B82" letter-spacing=".06em">© 2026 Eric Parker · CC BY 4.0 · eparker71.github.io/agile-ways-of-working</text>
</svg>
