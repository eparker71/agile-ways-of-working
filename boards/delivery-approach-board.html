<rect x="1134" y="218" width="5" height="98" rx="3" fill="#065F46"/>
<text x="1152" y="244" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#065F46">Agile</text>
<text x="1626" y="244" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="9.5" fill="#065F46" fill-opacity=".88">Mostly 1s and 2s · total about 10–20</text>
<text x="1152" y="268" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Deliver in short iterations, with the</text><text x="1152" y="284" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">customer close by. Plan a little, often.</text>
<rect x="1134" y="328" width="508" height="114" rx="8" fill="#FEF3C7" stroke="#92400E" stroke-opacity=".3"/>
<rect x="1134" y="328" width="5" height="114" rx="3" fill="#92400E"/>
<text x="1152" y="354" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#92400E">Hybrid</text>
<text x="1626" y="354" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="9.5" fill="#92400E" fill-opacity=".88">A mix · total about 21–35</text>
<text x="1152" y="378" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Iterate where learning matters, and plan</text><text x="1152" y="394" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">up front where change is costly. Agree</text><text x="1152" y="410" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">how the parts meet.</text>
<rect x="1134" y="454" width="508" height="114" rx="8" fill="#FEE2E2" stroke="#991B1B" stroke-opacity=".3"/>
<rect x="1134" y="454" width="5" height="114" rx="3" fill="#991B1B"/>
<text x="1152" y="480" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#991B1B">Predictive</text>
<text x="1626" y="480" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="9.5" fill="#991B1B" fill-opacity=".88">Mostly 4s and 5s · total about 36–50</text>
<text x="1152" y="504" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Plan and design up front, with formal</text><text x="1152" y="520" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">change control. Still look for chances</text><text x="1152" y="536" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">to get feedback early.</text>
<text x="1138" y="598" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-style="italic" fill="#334155">Most organisations end up hybrid. That's fine: the</text>
<text x="1138" y="614" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-style="italic" fill="#334155">aim is the right approach for each part of the work.</text>
