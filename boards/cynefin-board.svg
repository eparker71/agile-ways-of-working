<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1190" width="1680" height="1190" role="img" aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Cynefin® Sense-Making</title>
  <desc id="mg-desc">A3 landscape sense-making board inspired by the Cynefin framework: complex, complicated, chaotic and clear domains with the approach for each and space to place situations, a confused centre, and the chosen approach with safe-to-fail experiments and signals.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="fc" x="-4%" y="-4%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <filter id="fsm" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1.2" fill="#000" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1680" height="1190" fill="url(#bg)"/><rect x="0" y="0" width="1680" height="4" fill="#eb6c36"/><rect x="0" y="4" width="1680" height="134" fill="#0C1A2E"/><text x="24" y="70" font-family="'Instrument Serif',Georgia,serif" font-size="42" font-weight="400" fill="white">Cynefin® Sense-Making</text><text x="24" y="100" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" fill="#94A3B8">Sort situations by how predictable they are, then choose an approach that fits: analyse, experiment, act or follow the rule.</text><text x="24" y="120" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#8291A6" letter-spacing=".06em">Lead the Organisation · Inspired by the Cynefin® Framework (Dave Snowden) · Sense-Making · Choose Your Approach</text><text x="1356" y="66" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">TOPIC</text><line x1="1452" y1="69" x2="1656" y2="69" stroke="#334155" stroke-width="1.2"/><text x="1356" y="96" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#8291A6" letter-spacing=".14em">DATE</text><line x1="1452" y1="99" x2="1656" y2="99" stroke="#334155" stroke-width="1.2"/>
<rect x="24" y="148" width="534" height="449" rx="10" fill="#EDE9FE" stroke="#581C87" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24.0,200.0 V158.0 A10,10 0 0 1 34.0,148.0 H548.0 A10,10 0 0 1 558.0,158.0 V200.0 Z" fill="#581C87"/><circle cx="45.0" cy="174.0" r="12" fill="white" fill-opacity=".18"/><text x="45" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">1</text><text x="68" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Complex</text><text x="542" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">PROBE · SENSE · RESPOND</text>
<text x="42" y="230" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#581C87">Cause and effect only make sense afterwards.</text><text x="42" y="248" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#581C87">Run safe-to-fail experiments; amplify what works.</text>
<text x="42" y="276" font-family="'Geist Mono',Consolas,monospace" font-size="10" fill="#581C87" letter-spacing=".04em">Practice: emergent</text>
<rect x="38" y="292" width="506" height="291" rx="6" fill="url(#dots)"/><text x="291" y="431.5" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#581C87" fill-opacity=".22">Things we can only learn by trying</text><rect x="282" y="445.5" width="18" height="18" rx="2" fill="#FDE047" fill-opacity=".35"/>
<rect x="572" y="148" width="534" height="449" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M572.0,200.0 V158.0 A10,10 0 0 1 582.0,148.0 H1096.0 A10,10 0 0 1 1106.0,158.0 V200.0 Z" fill="#1E3A8A"/><circle cx="593.0" cy="174.0" r="12" fill="white" fill-opacity=".18"/><text x="593" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">2</text><text x="616" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Complicated</text><text x="1090" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">SENSE · ANALYSE · RESPOND</text>
<text x="590" y="230" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E3A8A">Cause and effect can be found with analysis or</text><text x="590" y="248" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E3A8A">expertise. Ask the experts and weigh options.</text>
<text x="590" y="276" font-family="'Geist Mono',Consolas,monospace" font-size="10" fill="#1E3A8A" letter-spacing=".04em">Practice: good practice (more than one right answer)</text>
<rect x="586" y="292" width="506" height="291" rx="6" fill="url(#dots)"/><text x="839" y="431.5" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#1E3A8A" fill-opacity=".22">Things experts can work out</text><rect x="830" y="445.5" width="18" height="18" rx="2" fill="#FDE047" fill-opacity=".35"/>
<rect x="24" y="611" width="534" height="449" rx="10" fill="#FEE2E2" stroke="#991B1B" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24.0,663.0 V621.0 A10,10 0 0 1 34.0,611.0 H548.0 A10,10 0 0 1 558.0,621.0 V663.0 Z" fill="#991B1B"/><circle cx="45.0" cy="637.0" r="12" fill="white" fill-opacity=".18"/><text x="45" y="642" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">3</text><text x="68" y="643" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Chaotic</text><text x="542" y="642" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">ACT · SENSE · RESPOND</text>
<text x="42" y="693" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#991B1B">No visible cause and effect. Act first to</text><text x="42" y="711" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#991B1B">stabilise, then move the situation to complex.</text>
<text x="42" y="739" font-family="'Geist Mono',Consolas,monospace" font-size="10" fill="#991B1B" letter-spacing=".04em">Practice: novel</text>
<rect x="38" y="755" width="506" height="291" rx="6" fill="url(#dots)"/><text x="291" y="894.5" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#991B1B" fill-opacity=".22">Crises needing action now</text><rect x="282" y="908.5" width="18" height="18" rx="2" fill="#FDE047" fill-opacity=".35"/>
<rect x="572" y="611" width="534" height="449" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M572.0,663.0 V621.0 A10,10 0 0 1 582.0,611.0 H1096.0 A10,10 0 0 1 1106.0,621.0 V663.0 Z" fill="#065F46"/><circle cx="593.0" cy="637.0" r="12" fill="white" fill-opacity=".18"/><text x="593" y="642" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">4</text><text x="616" y="643" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Clear</text><text x="1090" y="642" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">SENSE · CATEGORISE · RESPOND</text>
<text x="590" y="693" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">Cause and effect are obvious to everyone.</text><text x="590" y="711" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#065F46">Follow the agreed practice, but watch for complacency.</text>
<text x="590" y="739" font-family="'Geist Mono',Consolas,monospace" font-size="10" fill="#065F46" letter-spacing=".04em">Practice: best practice · beware the cliff into chaos</text>
<rect x="586" y="755" width="506" height="291" rx="6" fill="url(#dots)"/><text x="839" y="894.5" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#065F46" fill-opacity=".22">Things with a known right answer</text><rect x="830" y="908.5" width="18" height="18" rx="2" fill="#FDE047" fill-opacity=".35"/>
<rect x="1120" y="148" width="536" height="330" rx="10" fill="#F1F5F9" stroke="#334155" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1120,200 V158 A10,10 0 0 1 1130,148 H1646 A10,10 0 0 1 1656,158 V200 Z" fill="#334155"/><circle cx="1141" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="1141" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">5</text><text x="1164" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Confused? Split It Up</text><text x="1640" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">THE CENTRE</text>
<text x="1138" y="232" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">When you can't tell which domain you're in, you're</text><text x="1138" y="250" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">in confusion. People fall back on the approach they</text><text x="1138" y="268" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">like best. Break the situation into parts and place</text><text x="1138" y="286" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">each part in a domain.</text>
<text x="1138" y="334" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">Part 1:</text><line x1="1188.04" y1="338" x2="1638" y2="338" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="368" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">Part 2:</text><line x1="1188.04" y1="372" x2="1638" y2="372" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="402" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">Part 3:</text><line x1="1188.04" y1="406" x2="1638" y2="406" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="436" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#334155">Part 4:</text><line x1="1188.04" y1="440" x2="1638" y2="440" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="1120" y="492" width="536" height="568" rx="10" fill="#DCFCE7" stroke="#14532D" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1120,544 V502 A10,10 0 0 1 1130,492 H1646 A10,10 0 0 1 1656,502 V544 Z" fill="#14532D"/><circle cx="1141" cy="518" r="12" fill="white" fill-opacity=".18"/><text x="1141" y="523" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">6</text><text x="1164" y="524" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Our Approach</text><text x="1640" y="523" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">FOR THE SITUATION WE CHOSE</text>
<text x="1138" y="578" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Situation:</text><line x1="1205.2" y1="582" x2="1638" y2="582" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="618" x2="1638" y2="618" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="650" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Main domain:</text><line x1="1216.64" y1="654" x2="1638" y2="654" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="686" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">So we will:</text><line x1="1210.92" y1="690" x2="1638" y2="690" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="726" x2="1638" y2="726" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="758" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Safe-to-fail experiments:</text><line x1="1291" y1="762" x2="1638" y2="762" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="798" x2="1638" y2="798" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="834" x2="1638" y2="834" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="866" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Signs it's working:</text><line x1="1256.68" y1="870" x2="1638" y2="870" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="902" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Signs to stop:</text><line x1="1228.08" y1="906" x2="1638" y2="906" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="938" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Amplify or dampen by:</text><line x1="1268.12" y1="942" x2="1638" y2="942" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="1138" y1="978" x2="1638" y2="978" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1138" y="1010" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Revisit on:</text><line x1="1210.92" y1="1014" x2="1638" y2="1014" stroke="#CBD5E1" stroke-width="1.5"/>
<line x1="24" y1="1070" x2="1656" y2="1070" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“Are we treating a complex problem as if it were only complicated?”</text><line x1="832" y1="1078" x2="832" y2="1128" stroke="#E2E8F0" stroke-width="1"/><text x="848" y="1106" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#1E293B">“What's the smallest safe-to-fail experiment we could run?”</text><text x="1656" y="1138" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#5B6B82" letter-spacing=".08em">Cynefin® is a registered trademark of Cognitive Edge Pte Ltd · Lead the Organisation</text><text x="24" y="1138" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#5B6B82" letter-spacing=".06em">© 2026 Eric Parker · CC BY 4.0 · eparker71.github.io/better-delivery-toolkit</text>
</svg>
