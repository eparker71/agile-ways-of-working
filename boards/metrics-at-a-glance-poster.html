<text x="1353.2" y="234" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">How long an unfinished item has been in progress.</text>

<text x="1353.2" y="280" font-family="'Instrument Serif',Georgia,serif" font-size="13.5" font-style="italic" fill="#065F46">“Which items are stuck right now?”</text>
<text x="1353.2" y="306" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#991B1B" letter-spacing=".12em">MISUSED WHEN</text>
<text x="1353.2" y="324" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Only looking once items finish.</text>

<text x="38" y="516" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Items started but not yet finished.</text>
<text x="38" y="542" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#581C87" letter-spacing=".12em">ASKS</text>
<text x="38" y="562" font-family="'Instrument Serif',Georgia,serif" font-size="13.5" font-style="italic" fill="#581C87">“Are we starting more than we finish?”</text>

<text x="38" y="606" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Raising the limit whenever it's hit.</text>

<text x="366.8" y="516" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Share of lead time spent working, not waiting.</text>
<text x="366.8" y="542" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#581C87" letter-spacing=".12em">ASKS</text>
<text x="366.8" y="562" font-family="'Instrument Serif',Georgia,serif" font-size="13.5" font-style="italic" fill="#581C87">“How much of the time is waiting?”</text>
<text x="366.8" y="588" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#991B1B" letter-spacing=".12em">MISUSED WHEN</text>
<text x="366.8" y="606" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Making people busier, not cutting waits.</text>

<text x="1024.4" y="498" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">MEASURES</text>
<text x="1024.4" y="516" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Work done, and total scope, over time.</text>
<text x="1024.4" y="542" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">ASKS</text>
<text x="1024.4" y="562" font-family="'Instrument Serif',Georgia,serif" font-size="13.5" font-style="italic" fill="#1E3A8A">“Will we finish by the date?”</text>
<text x="1024.4" y="588" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#991B1B" letter-spacing=".12em">MISUSED WHEN</text>
<text x="1024.4" y="606" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">A burndown hides added scope.</text>
<line x1="1024.4" y1="658" x2="1313.2" y2="658" stroke="#1E3A8A" stroke-width="1" stroke-opacity=".25"/>
<text x="1024.4" y="680" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#1E3A8A"><tspan font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" letter-spacing=".12em">IN THIS KIT</tspan><tspan fill-opacity="0">: </tspan><tspan x="1094.4" font-weight="600">Release Forecast &amp; Burn-up</tspan></text>
<rect x="1339.2" y="430" width="316.8" height="268" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/>
<path d="M1339.2,474 V440 A10,10 0 0 1 1349.2,430 H1646.0 A10,10 0 0 1 1656.0,440 V474 Z" fill="#92400E"/>
<text x="1355.2" y="458" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="white">DORA four</text>
<text x="1353.2" y="498" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#92400E" letter-spacing=".12em">MEASURES</text>
<text x="1353.2" y="516" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Deploy frequency, lead time for changes, failure</text><text x="1353.2" y="532" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">rate, time to restore.</text>
<text x="1353.2" y="558" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#92400E" letter-spacing=".12em">ASKS</text>
<text x="1353.2" y="578" font-family="'Instrument Serif',Georgia,serif" font-size="13.5" font-style="italic" fill="#92400E">“Are we delivering faster and more</text><text x="1353.2" y="596" font-family="'Instrument Serif',Georgia,serif" font-size="13.5" font-style="italic" fill="#92400E">safely?”</text>
<text x="1353.2" y="622" font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" fill="#991B1B" letter-spacing=".12em">MISUSED WHEN</text>
<text x="1353.2" y="640" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Chasing speed and ignoring stability.</text>
<line x1="1353.2" y1="658" x2="1642" y2="658" stroke="#92400E" stroke-width="1" stroke-opacity=".25"/>
<text x="1353.2" y="680" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10.5" fill="#92400E"><tspan font-family="'Geist Mono',Consolas,monospace" font-size="8" font-weight="600" letter-spacing=".12em">IN THIS KIT</tspan><tspan fill-opacity="0">: </tspan><tspan x="1423.2" font-weight="600">Delivery Metrics &amp; Tech Debt</tspan></text>
<rect x="24" y="716" width="534.667" height="344" rx="10" fill="#E0F2FE" stroke="#0C4A6E" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,768 V726 A10,10 0 0 1 34,716 H548.6666666666666 A10,10 0 0 1 558.6666666666666,726 V768 Z" fill="#0C4A6E"/><text x="45" y="748" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Little's Law</text><text x="542.667" y="747" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">WHY LIMITING WIP SPEEDS THINGS UP</text>
<text x="291.333" y="820" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#0C4A6E">Cycle time = WIP / Throughput</text>
<text x="291.333" y="844" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#566578">(average items in progress / average items finished per week)</text>
<text x="42" y="884" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#1E293B">20 items in progress / 5 finished a week</text><text x="42" y="902" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#1E293B">= about 4 weeks for each item.</text>
<text x="42" y="938" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0C4A6E">Halve the work in progress to 10, at the same</text><text x="42" y="956" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0C4A6E">throughput, and items take about 2 weeks.</text>
<text x="42" y="1038" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" font-style="italic" fill="#0C4A6E" fill-opacity=".88">Holds for averages over a stable period. From queueing theory (John Little, 1961).</text>
<rect x="572.667" y="716" width="534.667" height="344" rx="10" fill="#DCFCE7" stroke="#14532D" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M572.6666666666666,768 V726 A10,10 0 0 1 582.6666666666666,716 H1097.3333333333333 A10,10 0 0 1 1107.3333333333333,726 V768 Z" fill="#14532D"/><text x="593.667" y="748" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Which Metric for Which Question?</text><text x="1091.33" y="747" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">START WITH THE QUESTION</text>
<text x="590.667" y="802" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#14532D"><tspan font-weight="600">When will it be done?</tspan><tspan fill-opacity="0">: </tspan><tspan x="778.667" fill="#1E293B" font-size="11.5">throughput, as a forecast range</tspan></text>
<text x="590.667" y="840" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#14532D"><tspan font-weight="600">What&#x27;s stuck right now?</tspan><tspan fill-opacity="0">: </tspan><tspan x="778.667" fill="#1E293B" font-size="11.5">work item age</tspan></text>
<text x="590.667" y="878" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#14532D"><tspan font-weight="600">Why is it slow?</tspan><tspan fill-opacity="0">: </tspan><tspan x="778.667" fill="#1E293B" font-size="11.5">flow efficiency, cumulative flow</tspan></text>
<text x="590.667" y="916" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#14532D"><tspan font-weight="600">What can we promise?</tspan><tspan fill-opacity="0">: </tspan><tspan x="778.667" fill="#1E293B" font-size="11.5">85th percentile cycle time</tspan></text>
<text x="590.667" y="954" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#14532D"><tspan font-weight="600">How much fits next?</tspan><tspan fill-opacity="0">: </tspan><tspan x="778.667" fill="#1E293B" font-size="11.5">velocity or throughput</tspan></text>
<text x="590.667" y="992" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12" fill="#14532D"><tspan font-weight="600">Are releases safe?</tspan><tspan fill-opacity="0">: </tspan><tspan x="778.667" fill="#1E293B" font-size="11.5">change failure rate, time to restore</tspan></text>
<rect x="1121.33" y="716" width="534.667" height="344" rx="10" fill="#FEE2E2" stroke="#991B1B" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1121.3333333333333,768 V726 A10,10 0 0 1 1131.3333333333333,716 H1646.0 A10,10 0 0 1 1656.0,726 V768 Z" fill="#991B1B"/><text x="1142.33" y="748" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Use Metrics Well</text><text x="1640" y="747" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">GOODHART'S LAW APPLIES</text>
<text x="1139.33" y="802" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#991B1B">Teams, never individuals</text>
<text x="1139.33" y="820" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Personal metrics get gamed and hurt teamwork.</text>
<text x="1139.33" y="848" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#991B1B">Ranges, not single numbers</text>
<text x="1139.33" y="866" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">“13–20 June” is honest; “15 June” isn't.</text>
<text x="1139.33" y="894" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#991B1B">Trends, not snapshots</text>
<text x="1139.33" y="912" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">One iteration tells you little; six tell a story.</text>
<text x="1139.33" y="940" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#991B1B">Speed with quality</text>
<text x="1139.33" y="958" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Pair every speed measure with a quality one.</text>
<text x="1139.33" y="986" font-family="'Geist',Inter,system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#991B1B">Questions, not targets</text>
<text x="1139.33" y="1004" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">When a measure becomes a target, it stops measuring.</text>
