<rect x="0" y="0" width="1680" height="1190" fill="url(#bg)"/><rect x="0" y="0" width="1680" height="4" fill="#eb6c36"/><rect x="0" y="4" width="1680" height="134" fill="#0C1A2E"/><text x="24" y="70" font-family="'Instrument Serif',Georgia,serif" font-size="42" font-weight="400" fill="white">Story Splitting</text><text x="24" y="100" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" fill="#94A3B8">When a story is too big to finish in an iteration, split it into thin, vertical slices that each deliver value.</text><text x="24" y="120" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#475569" letter-spacing=".06em">Break Down Work · INVEST · SPIDR · Story Splitting Patterns · Vertical Slicing</text><text x="1356" y="50" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#475569" letter-spacing=".14em">RUNNING EXAMPLE</text><text x="1356" y="74" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#CBD5E1">“As a shopper, I want to check out</text><text x="1356" y="93" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#CBD5E1">my basket so that I receive</text><text x="1356" y="112" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#CBD5E1">my order.”</text>

<text x="1456" y="204" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">Do we know how to</text><text x="1456" y="220" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#64748B">prove it's done?</text>
<text x="24" y="278" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#64748B" letter-spacing=".1em">BEFORE YOU SPLIT: DOES THE STORY PASS INVEST? IF “SMALL” FAILS, SPLIT IT. IF “VALUABLE” FAILS, RETHINK IT.</text>
