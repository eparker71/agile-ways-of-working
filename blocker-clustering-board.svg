  <title id="mg-title">Blocker Clustering</title>
  <desc id="mg-desc">A3 landscape board: blocker log, cleared blocker stickies, five cause clusters with counts and days, an action for the biggest cluster, and a trend table.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
