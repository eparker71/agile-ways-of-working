name: Suggest a scenario
description: Suggest a situation and possible fixes for the Scenario Playbook.
title: "Scenario: "
labels: ["scenario"]
body:
  - type: input
    id: situation
    attributes:
      label: The situation
      description: In a few words, e.g. "The deadline has just been moved earlier".
    validations:
      required: true
  - type: textarea
    id: notice
    attributes:
      label: What you'd notice
      description: What people see or hear when this is happening.
  - type: textarea
    id: first
    attributes:
      label: First moves
      description: What has worked for you in the first week. One per line.
    validations:
      required: true
  - type: textarea
    id: later
    attributes:
      label: Longer term
      description: What helps it happen less often. One per line.
  - type: input
    id: tools
    attributes:
      label: Tools from the toolkit that help (optional)
      description: e.g. Release Forecast & Burn-up, Prioritisation Board
