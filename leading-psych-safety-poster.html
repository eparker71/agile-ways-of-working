<rect x="24" y="148" width="534.667" height="340" rx="10" fill="#EDE9FE" stroke="#581C87" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24.0,200 V158 A10,10 0 0 1 34.0,148 H548.6666666666666 A10,10 0 0 1 558.6666666666666,158 V200 Z" fill="#581C87"/><circle cx="45.0" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="45" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">1</text><text x="68" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Set the Stage</text><text x="542.667" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">FRAME THE WORK</text>
<text x="42" y="230" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#581C87">Say the work is uncertain and needs everyone's</text><text x="42" y="247" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#581C87">input. Be open that you don't have all the answers.</text>
<text x="42" y="284" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#581C87" letter-spacing=".12em">DO</text>
<text x="42" y="308" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#581C87">✓</text>
<text x="60" y="308" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Explain why each person's view matters</text>
<text x="42" y="330" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#581C87">✓</text>
<text x="60" y="330" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Name the risks and unknowns out loud</text>
<text x="42" y="352" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#581C87">✓</text>
<text x="60" y="352" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Share a mistake of your own</text>
<text x="42" y="394" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#581C87" letter-spacing=".12em">SAY</text>
<text x="42" y="422" font-family="'Instrument Serif',Georgia,serif" font-size="17" font-style="italic" fill="#581C87">“This is new for all of us.”</text>
<text x="42" y="450" font-family="'Instrument Serif',Georgia,serif" font-size="17" font-style="italic" fill="#581C87">“I could be wrong about this.”</text>
<rect x="572.667" y="148" width="534.667" height="340" rx="10" fill="#DBEAFE" stroke="#1E3A8A" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M572.6666666666666,200 V158 A10,10 0 0 1 582.6666666666666,148 H1097.3333333333333 A10,10 0 0 1 1107.3333333333333,158 V200 Z" fill="#1E3A8A"/><circle cx="593.6666666666666" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="593.667" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">2</text><text x="616.667" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Invite Participation</text><text x="1091.33" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">ASK, THEN LISTEN</text>
<text x="590.667" y="230" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E3A8A">Ask genuine questions and build ways for</text><text x="590.667" y="247" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#1E3A8A">people to contribute, especially the quiet ones.</text>
<text x="590.667" y="284" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">DO</text>
<text x="590.667" y="308" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1E3A8A">✓</text>
<text x="608.667" y="308" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Ask open questions, then wait</text>
<text x="590.667" y="330" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1E3A8A">✓</text>
<text x="608.667" y="330" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Use silent writing and round-robins</text>
<text x="590.667" y="352" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1E3A8A">✓</text>
<text x="608.667" y="352" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Speak last in discussions</text>
<text x="590.667" y="394" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#1E3A8A" letter-spacing=".12em">SAY</text>
<text x="590.667" y="422" font-family="'Instrument Serif',Georgia,serif" font-size="17" font-style="italic" fill="#1E3A8A">“What are we missing?”</text>
<text x="590.667" y="450" font-family="'Instrument Serif',Georgia,serif" font-size="17" font-style="italic" fill="#1E3A8A">“Who sees this differently?”</text>
<rect x="1121.33" y="148" width="534.667" height="340" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M1121.3333333333333,200 V158 A10,10 0 0 1 1131.3333333333333,148 H1646.0 A10,10 0 0 1 1656.0,158 V200 Z" fill="#065F46"/><circle cx="1142.3333333333333" cy="174" r="12" fill="white" fill-opacity=".18"/><text x="1142.33" y="179" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">3</text><text x="1165.33" y="180" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Respond Productively</text><text x="1640" y="179" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">WHAT YOU DO NEXT DECIDES IT</text>
<text x="1139.33" y="230" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#065F46">How you react to bad news, questions and</text><text x="1139.33" y="247" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#065F46">failure tells people whether to speak again.</text>
<text x="1139.33" y="284" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#065F46" letter-spacing=".12em">DO</text>
<text x="1139.33" y="308" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#065F46">✓</text>
<text x="1157.33" y="308" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Thank people for raising problems</text>
<text x="1139.33" y="330" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#065F46">✓</text>
<text x="1157.33" y="330" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Treat failure as learning: ask what happened</text>
<text x="1139.33" y="352" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#065F46">✓</text>
<text x="1157.33" y="352" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#1E293B">Still address real misconduct, fairly</text>
<text x="1139.33" y="394" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" font-weight="600" fill="#065F46" letter-spacing=".12em">SAY</text>
<text x="1139.33" y="422" font-family="'Instrument Serif',Georgia,serif" font-size="17" font-style="italic" fill="#065F46">“Thank you for telling me early.”</text>
<text x="1139.33" y="450" font-family="'Instrument Serif',Georgia,serif" font-size="17" font-style="italic" fill="#065F46">“What can we learn from this?”</text>
<rect x="24" y="502" width="808" height="360" rx="10" fill="#F1F5F9" stroke="#334155" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,554 V512 A10,10 0 0 1 34,502 H822 A10,10 0 0 1 832,512 V554 Z" fill="#334155"/><circle cx="45" cy="528" r="12" fill="white" fill-opacity=".18"/><text x="45" y="533" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">4</text><text x="68" y="534" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Safety and Standards</text><text x="816" y="533" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">SAFETY IS NOT THE SAME AS COMFORT</text>
<rect x="80" y="574" width="364" height="115" rx="6" fill="#FEF3C7"/><rect x="80" y="574" width="364" height="115" rx="6" fill="url(#dots)"/><text x="94" y="600" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#92400E">Comfort Zone</text><text x="94" y="618" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#92400E" fill-opacity=".88">Safe, but little is asked of people</text><rect x="448" y="574" width="364" height="115" rx="6" fill="#D1FAE5"/><rect x="448" y="574" width="364" height="115" rx="6" fill="url(#dots)"/><text x="462" y="600" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#065F46">Learning Zone</text><text x="462" y="618" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#065F46" fill-opacity=".88">Safe to speak up, and high standards: aim here</text><rect x="80" y="693" width="364" height="115" rx="6" fill="#F1F5F9"/><rect x="80" y="693" width="364" height="115" rx="6" fill="url(#dots)"/><text x="94" y="719" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#334155">Apathy Zone</text><text x="94" y="737" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#334155" fill-opacity=".88">Not safe, and little expected</text><rect x="448" y="693" width="364" height="115" rx="6" fill="#FEE2E2"/><rect x="448" y="693" width="364" height="115" rx="6" fill="url(#dots)"/><text x="462" y="719" font-family="'Geist',Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#991B1B">Anxiety Zone</text><text x="462" y="737" font-family="'Geist',Inter,system-ui,sans-serif" font-size="10" fill="#991B1B" fill-opacity=".88">High pressure, but unsafe to speak up</text><line x1="78" y1="810" x2="814" y2="810" stroke="#1E293B" stroke-width="1.5"/><line x1="78" y1="572" x2="78" y2="810" stroke="#1E293B" stroke-width="1.5"/><text x="78" y="832" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#566578" letter-spacing=".12em">LOW STANDARDS</text><text x="814" y="832" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#566578" letter-spacing=".12em">HIGH STANDARDS</text><text x="446" y="832" text-anchor="middle" font-family="'Geist Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#1E293B" letter-spacing=".12em">ACCOUNTABILITY →</text><text transform="translate(56,691) rotate(-90)" text-anchor="middle" font-family="'Geist Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#1E293B" letter-spacing=".12em">PSYCHOLOGICAL SAFETY →</text>
<rect x="846" y="502" width="810" height="360" rx="10" fill="#F1F5F9" stroke="#334155" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M846,554 V512 A10,10 0 0 1 856,502 H1646 A10,10 0 0 1 1656,512 V554 Z" fill="#334155"/><circle cx="867" cy="528" r="12" fill="white" fill-opacity=".18"/><text x="867" y="533" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">5</text><text x="890" y="534" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Phrases to Use and Avoid</text>
<text x="864" y="582" font-family="'Geist Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#065F46" letter-spacing=".12em">TRY SAYING</text>
<text x="864" y="614" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#065F46">“What would you do?”</text>
<text x="864" y="652" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#065F46">“Help me understand.”</text>
<text x="864" y="690" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#065F46">“What did we learn?”</text>
<text x="864" y="728" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#065F46">“I'd value your view on this.”</text>
<text x="864" y="766" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#065F46">“Thanks for flagging that.”</text>
<text x="864" y="804" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#065F46">“Let's look at the process, not the person.”</text>
<text x="1260" y="582" font-family="'Geist Mono',Consolas,monospace" font-size="9" font-weight="600" fill="#991B1B" letter-spacing=".12em">AVOID SAYING</text>
<text x="1260" y="614" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#991B1B">“Who's responsible for this?”</text>
<text x="1260" y="652" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#991B1B">“That's not how we do it here.”</text>
<text x="1260" y="690" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#991B1B">“Why didn't you tell me sooner?”</text>
<text x="1260" y="728" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#991B1B">“Any questions? No? Good.”</text>
<text x="1260" y="766" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#991B1B">“Just make it work.”</text>
<text x="1260" y="804" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" fill="#991B1B">“I don't want problems, I want solutions.”</text>
<rect x="24" y="876" width="1082" height="184" rx="10" fill="#DCFCE7" stroke="#14532D" stroke-opacity=".18" stroke-width="1.5" filter="url(#fc)"/><path d="M24,928 V886 A10,10 0 0 1 34,876 H1096 A10,10 0 0 1 1106,886 V928 Z" fill="#14532D"/><circle cx="45" cy="902" r="12" fill="white" fill-opacity=".18"/><text x="45" y="907" text-anchor="middle" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="white">6</text><text x="68" y="908" font-family="'Geist',Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Daily Habits</text><text x="1090" y="907" text-anchor="end" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="white" fill-opacity=".88" letter-spacing=".10em">SMALL, REPEATED, VISIBLE</text>
<rect x="42" y="952" width="12" height="12" rx="2" fill="white" stroke="#14532D" stroke-opacity=".6" stroke-width="1.2"/><text x="62" y="962" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Open meetings by asking for risks and concerns</text>
<rect x="572" y="952" width="12" height="12" rx="2" fill="white" stroke="#14532D" stroke-opacity=".6" stroke-width="1.2"/><text x="592" y="962" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#14532D">Admit a mistake or a doubt each week</text>
