<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1190" width="1680" height="1190" role="img" aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Mad · Sad · Glad</title>
  <desc id="mg-desc">A3 landscape retrospective board: Mad, Sad, Glad. Sticky-note zones per column and three action slots for the next quarter.</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="fc" x="-4%" y="-4%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".10"/>
    </filter>
    <filter id="fsm" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1.2" fill="#000" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1680" height="1190" fill="url(#bg)"/><rect x="0" y="0" width="1680" height="4" fill="#eb6c36"/><rect x="0" y="4" width="1680" height="134" fill="#0C1A2E"/><rect x="1448" y="14" width="208" height="22" rx="11" fill="#eb6c36" fill-opacity=".18"/><text x="1552" y="29" text-anchor="middle" font-family="'Geist Mono',Consolas,monospace" font-size="8.5" fill="#eb6c36" letter-spacing=".10em">PRODUCT OPERATING MODEL 2.0</text><text x="24" y="70" font-family="'Instrument Serif',Georgia,serif" font-size="42" font-weight="400" fill="white">Mad · Sad · Glad</text><text x="24" y="100" font-family="'Geist',Inter,system-ui,sans-serif" font-size="13" fill="#94A3B8">How did the last quarter feel? Surface the emotions behind the work, then decide what to act on.</text><text x="24" y="120" font-family="'Geist Mono',Consolas,monospace" font-size="9" fill="#475569" letter-spacing=".06em">Retrospective Kit · Agile Team · Reflect, Learn, Adapt</text><text x="1356" y="44" font-family="'Geist Mono',Consolas,monospace" font-size="8" fill="#475569" letter-spacing=".14em">LEGEND</text><rect x="1356" y="52" width="22" height="22" rx="3" fill="#FDE047" filter="url(#fsm)"/><polygon points="1371,52 1378,59 1378,52" fill="#000" fill-opacity=".15"/><text x="1384" y="67" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#CBD5E1">Yellow Sticky = What Happened</text><rect x="1356" y="80" width="22" height="22" rx="3" fill="#4ADE80" filter="url(#fsm)"/><polygon points="1371,80 1378,87 1378,80" fill="#000" fill-opacity=".15"/><text x="1384" y="95" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#CBD5E1">Green Sticky = Idea / Action</text><circle cx="1367" cy="119" r="9" fill="#eb6c36"/><text x="1384" y="123" font-family="'Geist',Inter,system-ui,sans-serif" font-size="11" fill="#CBD5E1">Dot = Vote (3 per person)</text>
